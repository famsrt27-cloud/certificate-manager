name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.19.0
  PNPM_VERSION: 11.5.2

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Security tests
        run: pnpm test:security

      - name: Compose configuration
        run: pnpm compose:config

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Public verification browser tests
        run: pnpm exec playwright test tests/e2e/phase-six.spec.ts

      - name: Docker image build
        run: pnpm compose:build

  integration:
    name: Integration Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: certificate_platform_test
          POSTGRES_USER: certificate_app
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U certificate_app -d certificate_platform_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:8.2.3-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://certificate_app:ci-postgres-password@127.0.0.1:5432/certificate_platform_test
      TEST_DATABASE_URL: postgresql://certificate_app:ci-postgres-password@127.0.0.1:5432/certificate_platform_test
      TEST_REDIS_URL: redis://127.0.0.1:6379
      OBJECT_STORAGE_ENDPOINT: http://127.0.0.1:9000
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_BUCKET: certificate-platform-ci-private
      OBJECT_STORAGE_ACCESS_KEY: phase6-ci-minio
      OBJECT_STORAGE_SECRET_KEY: phase6-ci-minio-secret
      OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
      OBJECT_STORAGE_CREATE_BUCKET: "true"
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start private MinIO storage
        shell: bash
        run: |
          docker run --detach --name phase6-minio \
            --publish 127.0.0.1:9000:9000 \
            --env MINIO_ROOT_USER=phase6-ci-minio \
            --env MINIO_ROOT_PASSWORD=phase6-ci-minio-secret \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs phase6-minio
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Run integration tests
        run: pnpm test:integration
