worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  log_format production_json escape=json
    '{"service":"edge","request_id":"$upstream_http_x_request_id",'
    '"method":"$request_method","status":$status,'
    '"duration_ms":$request_time,"upstream_status":"$upstream_status"}';
  access_log /dev/stdout production_json;
  # Application and edge access logs are the supported observability channel.
  # Suppress verbose proxy error details, which can include client addresses.
  error_log /dev/null crit;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  client_max_body_size 16m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream web_upstream {
    server web:3000;
    keepalive 16;
  }

  server {
    listen 8080;
    server_name _;
    return 308 https://$host$request_uri;
  }

  server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate /run/secrets/tls_certificate;
    ssl_certificate_key /run/secrets/tls_private_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;

    # Health, metrics and API schema remain reachable only from private networks.
    location ^~ /health/ { return 404; }
    location = /metrics { return 404; }
    location = /openapi.json { return 404; }

    location / {
      proxy_http_version 1.1;
      proxy_pass http://web_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Port 443;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Forwarded "";
      proxy_set_header X-Request-ID "";
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Upgrade $http_upgrade;
      proxy_connect_timeout 2s;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
    }
  }
}
