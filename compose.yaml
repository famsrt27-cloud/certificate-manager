name: certificate-platform

x-server-environment: &server-environment
  NODE_ENV: development
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgresql://${POSTGRES_USER:-certificate_app}:${POSTGRES_PASSWORD:-local-postgres-change-me}@postgres:5432/${POSTGRES_DB:-certificate_platform}
  DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-10}
  REDIS_URL: redis://:${REDIS_PASSWORD:-local-redis-change-me}@redis:6379/0
  READINESS_TIMEOUT_MS: ${READINESS_TIMEOUT_MS:-2000}
  SESSION_SECRET: ${SESSION_SECRET:-local-session-secret-change-me-at-least-32-bytes}
  SESSION_IDLE_TTL_SECONDS: ${SESSION_IDLE_TTL_SECONDS:-1800}
  SESSION_ABSOLUTE_TTL_SECONDS: ${SESSION_ABSOLUTE_TTL_SECONDS:-28800}
  BCRYPT_COST: ${BCRYPT_COST:-12}
  LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-900}
  LOGIN_RATE_LIMIT_ACCOUNT_MAX: ${LOGIN_RATE_LIMIT_ACCOUNT_MAX:-5}
  LOGIN_RATE_LIMIT_NETWORK_MAX: ${LOGIN_RATE_LIMIT_NETWORK_MAX:-20}
  PUBLIC_VERIFICATION_RATE_LIMIT_WINDOW_SECONDS: ${PUBLIC_VERIFICATION_RATE_LIMIT_WINDOW_SECONDS:-60}
  PUBLIC_VERIFICATION_RATE_LIMIT_NETWORK_MAX: ${PUBLIC_VERIFICATION_RATE_LIMIT_NETWORK_MAX:-30}
  PUBLIC_DOWNLOAD_TOKEN_TTL_SECONDS: ${PUBLIC_DOWNLOAD_TOKEN_TTL_SECONDS:-60}
  PUBLIC_DOWNLOAD_AUTHORIZE_RATE_LIMIT_WINDOW_SECONDS: ${PUBLIC_DOWNLOAD_AUTHORIZE_RATE_LIMIT_WINDOW_SECONDS:-60}
  PUBLIC_DOWNLOAD_AUTHORIZE_RATE_LIMIT_NETWORK_MAX: ${PUBLIC_DOWNLOAD_AUTHORIZE_RATE_LIMIT_NETWORK_MAX:-10}
  ADMIN_ALLOWED_ORIGINS: ${ADMIN_ALLOWED_ORIGINS:-http://localhost:3000}
  ADMIN_MFA_POLICY: ${ADMIN_MFA_POLICY:-DEFERRED_NON_PRODUCTION}
  OBJECT_STORAGE_ENDPOINT: http://minio:9000
  OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
  OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-certificate-platform-private}
  OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-local-minio-admin}
  OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-local-minio-change-me}
  OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
  OBJECT_STORAGE_CREATE_BUCKET: "true"
  PARTICIPANT_IMPORT_MAX_BYTES: ${PARTICIPANT_IMPORT_MAX_BYTES:-5242880}
  PARTICIPANT_IMPORT_MAX_ROWS: ${PARTICIPANT_IMPORT_MAX_ROWS:-10000}
  PARTICIPANT_IMPORT_MAX_UNCOMPRESSED_BYTES: ${PARTICIPANT_IMPORT_MAX_UNCOMPRESSED_BYTES:-26214400}
  PARTICIPANT_IMPORT_RETENTION_HOURS: ${PARTICIPANT_IMPORT_RETENTION_HOURS:-168}
  PARTICIPANT_IMPORT_CONCURRENCY: ${PARTICIPANT_IMPORT_CONCURRENCY:-2}
  VERIFICATION_ACTIVE_KID: ${VERIFICATION_ACTIVE_KID:-development-key}
  VERIFICATION_SIGNING_KEYS_JSON: "${VERIFICATION_SIGNING_KEYS_JSON:-{\"development-key\":\"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA\"}}"
  BULLMQ_PREFIX: ${BULLMQ_PREFIX:-certificate-platform}

services:
  postgres:
    image: postgres:16.12-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-certificate_platform}
      POSTGRES_USER: ${POSTGRES_USER:-certificate_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-postgres-change-me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [internal, diagnostics]

  redis:
    image: redis:8.2.3-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-local-redis-change-me}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local-redis-change-me}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [internal, diagnostics]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-local-minio-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-minio-change-me}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [internal, diagnostics]

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      <<: *server-environment
      API_HOST: 0.0.0.0
      API_PORT: 3001
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3001/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks: [edge, internal]

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    environment:
      <<: *server-environment
      WORKER_HOST: 0.0.0.0
      WORKER_HEALTH_PORT: 3002
      CERTIFICATE_GENERATION_CONCURRENCY: ${CERTIFICATE_GENERATION_CONCURRENCY:-2}
      CERTIFICATE_RENDER_MAX_ASSET_BYTES: ${CERTIFICATE_RENDER_MAX_ASSET_BYTES:-10485760}
      CERTIFICATE_PDF_MAX_BYTES: ${CERTIFICATE_PDF_MAX_BYTES:-10485760}
      VERIFICATION_PUBLIC_BASE_URL: ${VERIFICATION_PUBLIC_BASE_URL:-http://localhost:3000}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3002/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks: [internal]

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_PATH: ${NEXT_PUBLIC_API_BASE_PATH:-/api}
      API_INTERNAL_BASE_URL: ${API_INTERNAL_BASE_URL:-http://api:3001}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks: [edge]

  migrate:
    profiles: [tools]
    build:
      context: .
      target: migrate
    environment:
      <<: *server-environment
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    networks: [internal]

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  edge:
  diagnostics:
  internal:
    internal: true
