name: certificate-platform-restore-drill

services:
  postgres-source:
    image: postgres:16.12-alpine
    environment:
      POSTGRES_DB: certificate_platform_restore_source
      POSTGRES_USER: restore_drill
      POSTGRES_PASSWORD: restore-drill-local-only
    ports: ["127.0.0.1:55434:5432"]
    volumes: ["restore-drill-postgres-source:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restore_drill -d certificate_platform_restore_source"]
      interval: 2s
      timeout: 2s
      retries: 20

  postgres-restored:
    image: postgres:16.12-alpine
    environment:
      POSTGRES_DB: certificate_platform_restore_target
      POSTGRES_USER: restore_drill
      POSTGRES_PASSWORD: restore-drill-local-only
    ports: ["127.0.0.1:55435:5432"]
    volumes: ["restore-drill-postgres-target:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restore_drill -d certificate_platform_restore_target"]
      interval: 2s
      timeout: 2s
      retries: 20

  minio-source:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data"]
    environment: { MINIO_ROOT_USER: restore-drill-source, MINIO_ROOT_PASSWORD: restore-drill-source-secret }
    ports: ["127.0.0.1:9004:9000"]
    volumes: ["restore-drill-minio-source:/data"]
    healthcheck: { test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"], interval: 2s, timeout: 2s, retries: 20 }

  minio-backup:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data"]
    environment: { MINIO_ROOT_USER: restore-drill-backup, MINIO_ROOT_PASSWORD: restore-drill-backup-secret }
    ports: ["127.0.0.1:9005:9000"]
    volumes: ["restore-drill-minio-backup:/data"]
    healthcheck: { test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"], interval: 2s, timeout: 2s, retries: 20 }

  minio-restored:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data"]
    environment: { MINIO_ROOT_USER: restore-drill-target, MINIO_ROOT_PASSWORD: restore-drill-target-secret }
    ports: ["127.0.0.1:9006:9000"]
    volumes: ["restore-drill-minio-target:/data"]
    healthcheck: { test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"], interval: 2s, timeout: 2s, retries: 20 }

volumes:
  restore-drill-postgres-source:
  restore-drill-postgres-target:
  restore-drill-minio-source:
  restore-drill-minio-backup:
  restore-drill-minio-target:
